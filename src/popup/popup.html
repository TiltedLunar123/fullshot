<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fullshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon-32.png" width="24" height="24" alt="" />
      <h1>Fullshot</h1>
    </header>

    <div class="modes" role="group" aria-label="Capture mode">
      <button class="mode" data-mode="full" autofocus>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M12 8v7m0 0-3-3m3 3 3-3" />
        </svg>
        <span class="mode-text">
          <strong>Full page</strong>
          <small>Everything, top to bottom</small>
        </span>
        <kbd>Alt+Shift+S</kbd>
      </button>

      <button class="mode" data-mode="visible">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
        </svg>
        <span class="mode-text">
          <strong>Visible area</strong>
          <small>Just what you can see</small>
        </span>
        <kbd>Alt+Shift+V</kbd>
      </button>

      <button class="mode" data-mode="element">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" />
        </svg>
        <span class="mode-text">
          <strong>Pick an element</strong>
          <small>Click any part of the page</small>
        </span>
      </button>

      <button class="mode" data-mode="area">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M14 9v6m0 0-2-2m2 2 2-2" />
        </svg>
        <span class="mode-text">
          <strong>Scrolling panel</strong>
          <small>Inner panes in chat and mail apps</small>
        </span>
      </button>
    </div>

    <p class="status" role="status" aria-live="polite"></p>

    <footer class="foot">
      <button class="link" id="options">Settings</button>
      <span class="privacy" title="Fullshot makes no network requests at all.">No account &middot; No tracking</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
