<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tall scrolling pane</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px 24px;
        font: 15px/1.4 system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 18px;
      }
      /*
        The point of this fixture: the pane's own box is TALLER than the
        viewport the harness runs at (1280x900, so roughly 770 usable CSS px).
        Scrolling the pane alone therefore runs out before its last screenful of
        content has been shown, because once scrollTop is at its maximum the
        bottom of the content sits at the bottom of the pane's box, off screen
        below. Reaching it needs the window to move as well.
      */
      #pane {
        width: 720px;
        height: 1100px;
        overflow-y: auto;
        border: 6px solid #f43f5e;
        background: #fff;
      }
      .row {
        /* Narrower than the wrapper on purpose, so there is a strip of #rows
           itself for the element picker to land on. */
        width: 600px;
        height: 100px;
        padding-left: 14px;
        font: 600 20px/100px system-ui, sans-serif;
        color: #fff;
      }
      /* A tail long enough that the page can scroll far enough to bring the
         bottom of the pane into view. */
      .tail {
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <h1>Tall scrolling pane</h1>
    <div id="pane">
      <!--
        The rows live in a wrapper so that element mode has something to pick
        that is FAR taller than the panel showing it. The wrapper's box is
        3000px; the panel only ever lets 1088px of it through, and the rest of
        the wrapper's height covers page background that is nothing to do with
        it.
      -->
      <div id="rows"></div>
    </div>
    <div class="tail"></div>

    <script>
      const ROWS = 30;
      const ROW_HEIGHT = 100;
      const pane = document.getElementById('pane');
      const rows = document.getElementById('rows');

      for (let i = 0; i < ROWS; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.index = String(i);
        // Row index encoded in the red channel, exactly like the torture
        // fixture, so a sampled pixel identifies which row it came from.
        row.style.background = `rgb(${i * 8}, 90, 160)`;
        row.textContent = `Row ${i}`;
        rows.append(row);
      }

      window.__tallPane = {
        rows: ROWS,
        rowHeight: ROW_HEIGHT,
        clientHeight: pane.clientHeight,
        scrollHeight: pane.scrollHeight,
        wrapperHeight: rows.getBoundingClientRect().height,
      };
    </script>
  </body>
</html>
